name: Sync Upstream Theme

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with upstream AstroPaper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/satnaing/astro-paper.git
          git fetch upstream

      - name: Check for new upstream commits
        id: check
        run: |
          COUNT=$(git rev-list HEAD..upstream/main --count)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Upstream has $COUNT new commit(s)"

      - name: Create sync branch and merge
        if: steps.check.outputs.count != '0'
        id: merge
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          BRANCH="sync/upstream-$DATE"
          git checkout -b "$BRANCH"

          if git merge upstream/main --no-edit; then
            echo "conflicts=false" >> $GITHUB_OUTPUT
          else
            echo "conflicts=true" >> $GITHUB_OUTPUT
            git add -A
            git commit -m "WIP: merge upstream (conflicts need manual resolution)"
          fi

          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const conflicts = '${{ steps.merge.outputs.conflicts }}' === 'true';
            const date = '${{ steps.merge.outputs.date }}';
            const branch = '${{ steps.merge.outputs.branch }}';

            const title = conflicts
              ? `⚠️ chore: sync upstream AstroPaper (${date}) — 需解决冲突`
              : `chore: sync upstream AstroPaper (${date})`;

            const body = conflicts
              ? [
                  '## ⚠️ 上游同步（含冲突）',
                  '',
                  '此 PR 同步了 [AstroPaper](https://github.com/satnaing/astro-paper) 的最新更改，但**存在合并冲突**，请 checkout 此分支后手动解决冲突再合并。',
                  '',
                  '```bash',
                  `git fetch origin && git checkout ${branch}`,
                  '# 解决冲突后：',
                  'git add . && git commit && git push',
                  '```',
                ].join('\n')
              : [
                  '## 上游同步',
                  '',
                  '此 PR 同步了 [AstroPaper](https://github.com/satnaing/astro-paper) 的最新更改，自动合并无冲突。',
                  '',
                  '合并前请确认以下自定义文件未被覆盖：',
                  '- `src/config.ts`',
                  '- `src/constants.ts`',
                  '- `src/styles/`',
                  '- `src/components/Footer.astro`',
                  '- `src/components/Header.astro`',
                ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: 'main',
              body,
            });

            core.info(`Created PR #${pr.number}: ${pr.html_url}`);
